# .github/workflows/cpp.yml

name: Cplusplus

on:
  push:
    branches: [ "main" ]
    paths:
    - cpp/**
    - .github/workflows/cpp.yml
  pull_request:
    branches: [ "main" ]
    paths:
    - cpp/**
    - .github/workflows/cpp.yml

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y meson ninja-build g++
        pipx install clang-format==23.1.1
        pipx install clang-tidy==23.1.1
        # pipx automatically places the 'clang-format' and 'clang-tidy' binaries into the runner's PATH        

    - name: Check clang-format version
      run: clang-format --version

    - name: Check clang-format
      working-directory: ./cpp
      run: |
        find include src tests \
          -type f \( -name '*.cpp' -o -name '*.hpp' \) \
          -exec clang-format --dry-run --Werror {} +

    - name: Configure build
      working-directory: ./cpp
      run: meson setup build

    - name: Run clang-tidy
      working-directory: ./cpp
      run: |
        find include src tests \
          -type f \( -name '*.cpp' -o -name '*.hpp' \) \
          -exec clang-tidy -p build {} +

    - name: Build
      working-directory: ./cpp
      run: meson compile -C build

    - name: Run tests
      working-directory: ./cpp
      run: meson test -C build
